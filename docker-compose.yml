# RQ-80 — 사내망 단일 호스트 배포 (ADR-0009).
#
# 2서비스 구성: app(게임 서버) + nginx(리버스 프록시·정적 자산). Redis는
# 넣지 않는다 — 세션 상태 영속(RQ-81 세션 절반, 원장 26b)은 별도 라운드로
# 유예한다. **통계 영속(RQ-81 통계 절반, 원장 26a)은 이 파일에 구현돼
# 있다** — `app` 서비스의 `stats-data` named volume(아래) 참고. 무중단
# 배포는 RQ-80이 비목표로 명시했으므로 재배포/재시작 시 접속 끊김·세션
# 소실을 그대로 수용한다(GA-43이 검증하는 건 "재시작 후 복구"이지 "끊김
# 없음"이 아니다) — **통계는 이 소실 범위 밖이다**(named volume이 컨테이너
# 재생성과 무관하게 살아남는다, RQ-81 "재시작 시 세션은 소실하되 통계는
# 보존").
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    image: chatstrike-app:local
    restart: unless-stopped
    environment:
      # 컨테이너 기본값(src/server/index.ts: PORT=2567, HOST=0.0.0.0)과
      # 동일하지만, 배포 계약을 이 파일에 명시적으로 남겨 운영자가 서버
      # 소스를 열어보지 않아도 알 수 있게 한다.
      #
      # 주의(리뷰 minor 4): 이 값은 겉보기와 달리 단독으로 오버라이드할 수
      # 없다 — 바꾸면 아래 healthcheck의 URL(2567 하드코딩)과
      # `nginx.conf`의 `upstream chatstrike_app { server app:2567; }`도
      # **함께** 바꿔야 한다. 셋 중 하나만 바꾸면 healthcheck 실패(→
      # nginx가 `depends_on: service_healthy`로 영영 대기) 또는 nginx→app
      # 프록시 연결 실패로 이어진다. 지금은 세 곳이 상수를 중복 보유한
      # 상태를 "env로 바꿀 수 있다"는 착각 없이 명시해두는 것으로 대응한다
      # (실제 동적화는 nginx 템플릿(envsubst) 도입이 필요 — 이번 라운드
      # 스코프 밖).
      - PORT=2567
      - HOST=0.0.0.0
      - NODE_ENV=production
    expose:
      - '2567'
    # RQ-81(평가 major 5): 통계 SQLite 파일(`src/server/index.ts`
    # `PRODUCTION_STATS_DB_PATH` 기본값 `join(process.cwd(), 'data',
    # 'stats.db')` → 이 컨테이너의 `WORKDIR /app` 기준 `/app/data/stats.db`)이
    # 컨테이너 생명주기와 분리되도록 named volume에 둔다. 이게 없으면
    # `restart: unless-stopped`(같은 컨테이너 재시작)까지는 살아남지만
    # 이미지 재빌드·`up --build`·컨테이너 재생성 시 통계가 통째로
    # 사라진다 — RQ-81 "재시작 시 세션은 소실해도 통계는 보존"이 프로세스
    # 수준(테스트가 증명)에서는 성립해도 배포 수준에서는 성립하지 않았다.
    # 마운트 지점 소유권은 `Dockerfile`의 `RUN mkdir -p /app/data && chown
    # node:node /app/data`가 미리 맞춰둔다(그 줄 코멘트 참고 — 없으면
    # 비루트 `node` 유저가 볼륨에 쓰지 못한다).
    volumes:
      - stats-data:/app/data
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', '--spider', 'http://127.0.0.1:2567/health']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: chatstrike-nginx:local
    restart: unless-stopped
    depends_on:
      # app이 실제로 /health에 응답할 때까지 nginx 기동을 미룬다 — 정적
      # upstream(nginx.conf `upstream chatstrike_app`)은 기동 시 한 번만
      # 이름을 해석하므로, app 컨테이너가 존재하기 전에 nginx가 먼저
      # config를 로드하면 "host not found in upstream" 로 죽는다.
      app:
        condition: service_healthy
    ports:
      # 호스트에 노출하는 유일한 포트 — HTTP/WS 동일 오리진(ADR-0009).
      # app은 nginx를 통해서만 도달 가능하다(직접 포트 게시 없음).
      - '${HOST_HTTP_PORT:-8080}:80'
      # --- TLS 종단(현재 비활성) — ADR-0009 결정 2, 리뷰 major 2(a안).
      # `nginx.conf` 하단의 주석 처리된 `listen 443 ssl` 서버 블록과 짝을
      # 이룬다. 활성화 절차는 nginx.conf 쪽 주석에 번호로 정리했다 —
      # 여기서는 포트 게시만 주석 해제하면 된다(코드 변경 불필요).
      # - '443:443'
    # volumes:
    #   # TLS 인증서(현재 비활성) — 호스트 ./certs/에 fullchain.pem·
    #   # privkey.pem을 두고 이 블록 전체(volumes: 포함)의 주석을 해제하면
    #   # nginx.conf의 `/etc/nginx/certs/...` 경로가 그 파일을 가리킨다
    #   # (ADR-0009 결정 2 "인증서 경로를 환경변수/볼륨으로"). 빈 `volumes:`
    #   # 키는 YAML상 무효(compose가 "must be a array"로 거부)라 지금은
    #   # 키 자체를 통째로 주석 처리해뒀다 — 활성화 시 아래 두 줄의 `#`를
    #   # 모두 지운다.
    #   - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', '--spider', 'http://127.0.0.1/']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

# RQ-81(평가 major 5): `app` 서비스의 통계 SQLite 볼륨. 이름 있는(named)
# 볼륨이라 `docker compose down`(볼륨 미삭제 기본 동작)·이미지 재빌드·
# 컨테이너 재생성 전부에서 살아남는다 — `docker compose down -v`로
# 명시적으로 지우기 전까지는 보존된다(ADR-0009가 이미 named volume을
# 상정).
volumes:
  stats-data:
