# RQ-80 — HTTP/WS 동일 오리진 리버스 프록시 + 정적 클라이언트 자산 서빙
# (ADR-0009 결정 2·3). `Dockerfile`의 `web` 스테이지가 이 파일을
# `/etc/nginx/conf.d/default.conf`에 굽는다(베이스 이미지의 `nginx.conf`가
# `include /etc/nginx/conf.d/*.conf;`를 http 컨텍스트 안에서 수행하므로,
# 여기 최상단의 `map` 지시자도 http 컨텍스트에 유효하게 들어간다).
#
# 사내망/로컬 전용 배포(RQ-80 확정)라 TLS를 요구하지 않는다 — 파일 하단
# "TLS 종단(현재 비활성)" 서버 블록 참고. 지금 인증서를 준비·강제하지 않는다.

# WebSocket 업그레이드 시 Connection 헤더는 반드시 "upgrade"여야 하고,
# 일반 HTTP 요청에서는 비워야 커넥션 재사용(keep-alive)이 깨지지 않는다
# (nginx 공식 WebSocket 프록시 가이드의 표준 패턴).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 정적 upstream — 컨테이너 이름 `app`은 docker-compose가 내부 DNS로 해석한다.
# `docker compose restart app`(GA-43)은 같은 컨테이너를 재시작할 뿐 IP가
# 바뀌지 않으므로 이 정적 해석으로 충분하다(재생성/스케일 시나리오라면
# resolver 기반 동적 upstream이 필요 — 지금 스코프 밖, 아래 근거 참고).
upstream chatstrike_app {
    server app:2567;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 리뷰 minor 1 — 사내망이라 치명적이진 않으나 클라 번들(~1.2MB, 비압축
    # 실측 확인)이 그대로 나가면 Wi-Fi 클라이언트 첫 로딩이 느려진다.
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    # 리뷰 minor 2 — vite가 콘텐츠 해시를 파일명에 넣으므로(예:
    # index-CQmwyXwh.js) 같은 파일명이 다시 오면 반드시 같은 내용이다 —
    # 장기 캐시가 안전하다. index.html은 배포마다 자산 해시가 바뀌므로
    # 캐시하면 안 된다(no-cache = 매번 재검증, 낡은 번들 참조 방지).
    #
    # 델타 재리뷰 minor D1: `expires`와 `add_header Cache-Control`을
    # 함께 쓰면 nginx가 각각 Cache-Control 헤더를 내보내 응답에 중복
    # 헤더가 실린다(실측 확인) — `expires`를 빼고 `max-age`까지 포함한
    # 값 하나를 `add_header`로만 낸다.
    location ~* \.(?:js|css|woff2)$ {
        try_files $uri @app;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        try_files $uri @app;
        add_header Cache-Control "no-cache";
    }

    # Colyseus 매치메이킹 HTTP 라우트(POST /matchmake/<method>/<roomName>,
    # colyseus.js `Client.createMatchMakeRequest`) + 게임 서버 헬스체크
    # (`/health`, GA-41) + 룸 WebSocket 업그레이드(colyseus.js
    # `Client.buildEndpoint`가 만드는 `/<processId>/<roomId>?sessionId=...`
    # — matchmake 프리픽스 밖의 루트 경로다. `@colyseus/ws-transport`의
    # `WebSocketServer`가 `path` 제한 없이 Fastify의 raw HTTP 서버에 붙어
    # 모든 경로의 업그레이드를 받기 때문이다, 실측:
    # `node_modules/@colyseus/ws-transport/build/WebSocketTransport.js`).
    #
    # roomId·processId는 예측 불가능한 값이라 경로 패턴으로 미리 열거할 수
    # 없다 — 따라서 "정적 파일이 실재하면 그걸 서빙하고, 없으면 전부
    # 애플리케이션 서버로 프록시"가 유일하게 견고한 라우팅이다. 클라이언트
    # 번들(JS/CSS)과 index.html은 실제 파일이므로 이 규칙과 충돌하지 않는다.
    location / {
        try_files $uri $uri/ @app;
    }

    location @app {
        proxy_pass http://chatstrike_app;
        proxy_http_version 1.1;

        # WS 업그레이드 필수 헤더 — 없으면 매치메이킹(HTTP)은 되지만 룸
        # 접속(WS 핸드셰이크)이 프록시를 통과하지 못한다(GA-42가 이걸 검증).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 상설 세션(RQ-04) WS 연결은 장시간 유지된다 — nginx 기본 유휴
        # 타임아웃(60s)으로 끊기지 않도록 넉넉히 늘린다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# --- TLS 종단(현재 비활성) — ADR-0009 결정 2, 리뷰 major 2 대응(a안) ---
#
# ADR-0009 결정 2: "Nginx 설정은 서버 블록을 분리하고 인증서 경로를
# 환경변수/볼륨으로 빼둬, 나중에 `listen 443 ssl`과 인증서만 추가하면 TLS
# 종단을 붙일 수 있도록 구성을 열어둔다." 아래 블록이 그 "분리된 서버
# 블록"이다 — 인증서 경로는 고정 볼륨 마운트 지점(`/etc/nginx/certs/`,
# `docker-compose.yml`의 주석 처리된 `certs` 볼륨과 짝을 이룬다)을 가리켜
# "환경변수/볼륨" 중 볼륨 쪽으로 열어뒀다(고정 경로라 이미지 빌드 시점
# envsubst 같은 별도 템플릿 처리 없이도 유효하다). 활성화 절차:
#   1. `./certs/`에 fullchain.pem·privkey.pem을 배치
#   2. 아래 `server { ... }` 블록의 주석을 해제
#   3. `docker-compose.yml`의 `# - '443:443'`·`# - ./certs:/etc/nginx/certs:ro`
#      주석을 해제
#   4. `docker compose up -d --build nginx`
# 사내망/로컬 전용 배포(RQ-80 확정)엔 불필요해 지금 인증서를 준비·발급하지
# 않고, 위 4단계 전부가 "설정 변경 + 인증서 배치"로 끝나 코드 변경이
# 필요 없음을 이 블록으로 보장한다.
